
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>noskill Learning</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap"
          rel="stylesheet">
</head>

<body style="
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: radial-gradient(circle at 15% 20%, #DFE5FF, transparent 35%),
                radial-gradient(circle at 85% 80%, #E8DFFF, transparent 35%),
                #F5F5FF;
    font-family: 'Poppins', sans-serif;
">

    <main style="
        width: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 20px;
        box-sizing: border-box;
    ">

        <div style="
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 30px;
        ">
            <span style="font-size: 45px; color: #8065D9;">✦</span>

            <h1 style="
                color: #4056A1;
                font-size: clamp(30px, 5vw, 46px);
                font-weight: 800;
                margin: 0;
            ">
                noskill Learning
            </h1>
        </div>

        <form action="/" method="POST" style="
            display: flex;
            gap: 10px;
            width: 100%;
            max-width: 480px;
            padding: 15px;
            background: white;
            border-radius: 16px;
            box-shadow: 0 10px 35px rgba(94, 100, 180, 0.12);
            box-sizing: border-box;
        ">

            <input
                type="text"
                name="topic"
                placeholder="Enter a topic..."
                required
                style="
                    flex: 1;
                    min-width: 0;
                    padding: 13px;
                    border: 1px solid #E2E5F3;
                    border-radius: 10px;
                    font-family: inherit;
                    font-size: 14px;
                    color: #526581;
                "
            >

            <button type="submit" style="
                padding: 12px 22px;
                background: linear-gradient(120deg, #6965D8, #9275DF);
                color: white;
                border: none;
                border-radius: 10px;
                font-family: inherit;
                font-weight: 600;
                cursor: pointer;
            ">
                Enter →
            </button>

        </form>

    </main>

</body>
</html>
