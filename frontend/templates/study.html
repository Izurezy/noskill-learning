
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>noskill Learning</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap"
          rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

    <style>
        body.study-page {
            min-height: 100vh;
            background:
                radial-gradient(circle at 15% 20%, #DFE5FF 0, transparent 35%),
                radial-gradient(circle at 85% 80%, #E8DFFF 0, transparent 35%),
                #F5F5FF;
        }

        .study-brand {
            font-size: 38px;
            font-weight: 800;
            color: #4056A1;
            text-align: center;
            padding: 25px 0;
        }

        .study-brand span {
            color: #8065D9;
            font-size: 46px;
        }

        .study-topic {
            text-align: center;
            margin: 25px 0 35px;
        }

        .study-topic h2 {
            font-size: 26px;
            color: #4056A1;
        }

        .study-topic p {
            color: #526581;
        }

        .study-notes {
            width: 100%;
            background: white;
            border-radius: 18px;
            padding: 25px;
            box-shadow: 0 8px 35px rgba(87, 98, 165, 0.08);
        }

        .study-notes h3 {
            color: #4056A1;
            margin-bottom: 20px;
        }

        .study-notes li {
            color: #637493;
            background: #F6F6FF;
            border: 1px solid #EEEEFA;
            border-radius: 12px;
            padding: 14px;
            margin-bottom: 12px;
        }

        .video-wrapper {
            border-radius: 15px;
            overflow: hidden;
        }

        /* Left half of screen */
        .study-content {
            width: 50%;
            padding-left: 25px;
            padding-right: 25px;
        }

        @media (max-width: 768px) {
            .study-content {
                width: 100%;
                padding-left: 15px;
                padding-right: 15px;
            }
        }
    </style>
</head>

<body class="study-page">

    <!-- Website Logo -->
    <div class="study-brand">
        <span>✦</span> noskill Learning
    </div>

    <!-- Currently Studying -->
    <div class="study-topic">
        <h2>Currently studying</h2>
        <p>{{ topic }}</p>
    </div>

    <!-- Main Content -->
    <main class="study-content">

        <!-- Video -->
        <div class="ratio ratio-16x9 video-wrapper mb-4">
            <iframe
                src="https://www.youtube.com/embed/VIDEO_ID"
                title="Learning Video"
                allowfullscreen>
            </iframe>
        </div>

        <!-- Study Notes -->
        <div class="study-notes">

            <h3>Study Notes</h3>

            <ul class="list-unstyled mb-0">
                <li>First note goes here</li>
                <li>Second note goes here</li>
                <li>Third note goes here</li>
                <li>Fourth note goes here</li>
                <li>Fifth note goes here</li>
            </ul>

        </div>

    </main>

</body>
</html>
